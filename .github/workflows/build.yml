name: Build plugins
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build both plugins
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: WoonPrefixes-1.0.0
          path: WoonPrefixes/target/WoonPrefixes-1.0.0.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WoonCases-1.0.0
          path: WoonCases/target/WoonCases-1.0.0.jar
          if-no-files-found: error
