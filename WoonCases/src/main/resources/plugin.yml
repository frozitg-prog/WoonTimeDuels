name: WoonCases
version: 1.0.0
main: ru.woontime.cases.WoonCases
api-version: '1.21'
softdepend: [DeluxeMenus, WoonPrefixes]
commands:
  wooncases:
    description: Управление кейсами
    usage: /wooncases <setblock|remove|reload>
    aliases: [wc]
  case:
    description: Открыть выбранный кейс рядом с блоком
    usage: /case open <id>
permissions:
  wooncases.admin:
    default: op
